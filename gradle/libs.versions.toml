[versions]
kotlin = "2.2.0"
compose-multiplatform = "1.10.3"
agp = "9.4.0"
androidx-activityCompose = "1.13.0"
androidx-lifecycle = "2.9.4"
# Task 8: androidx.core.content.FileProvider, used by Sharer.android.kt to
# hand a cache-dir PNG to WhatsApp/Instagram/the system chooser via a
# content:// URI (a raw file:// Uri would be blocked by StrictMode's
# FileUriExposedException on API 24+).
androidx-core-ktx = "1.17.0"
# Play Store readiness: androidx.core.splashscreen backports the Android 12
# SplashScreen API down to minSdk 24 — MainActivity calls installSplashScreen()
# before super.onCreate(), themed by Theme.CalmColoring.Starting below.
androidx-core-splashscreen = "1.0.1"
# JetBrains' Compose-Multiplatform-compatible fork of Navigation 3, per
# https://kotlinlang.org/docs/multiplatform/compose-navigation-3.html — publishes real
# android/iosArm64/iosSimulatorArm64/iosX64/desktop/js/wasmJs targets under this group.
# (Google's own androidx.navigation3:navigation3-* is Android-only/aar; do not use that
# group here.) Only navigation3-ui needs to be declared directly: navigation3-common is
# pulled in transitively, and there is no separate navigation3-runtime artifact in this
# group (unlike Google's split). 1.1.1 is the latest true stable (1.2.0-beta01 is beta).
# KNOWN GAP for Task 5: this artifact's iOS klibs (1.1.1 and 1.1.0 both checked) were built
# with Kotlin 2.3.20's compiler ABI, which our current kotlin=2.2.0 (pinned to match
# compose-multiplatform 1.10.3's own floor) cannot read — compileKotlinIosSimulatorArm64
# fails with "KLIB ... incompatible ABI version '2.3.0'" when this is on iosMain's
# classpath. Android resolves and compiles fine today. Using this on iOS will need the
# project's kotlin/compose-multiplatform versions bumped together first.
# Pinned here (not yet consumed by any module) so Task 5 has a verified-resolvable coordinate to start from.
androidx-navigation3-ui = "1.1.1"
# Task 2: composeApp's androidUnitTest runs against the stub android.jar (no
# real graphics implementation), which makes every androidx.compose.ui.graphics.Path
# / PathMeasure call throw "Method ... not mocked" — verified directly (even a
# bare moveTo/lineTo/close throws). Robolectric's shadow classes provide a real
# java.awt.geom-backed implementation of android.graphics.Path/PathMeasure/RectF,
# so TemplateCatalogTest (which builds and samples real Paths) needs it to run
# on the JVM. Chosen sdk in @Config pins an SDK Robolectric has shadows for,
# independent of this module's compileSdk.
robolectric = "4.15.1"
# Task 9: androidInstrumentedTest's one Compose UI test (ColoringScreenTest)
# needs the real ui-test-junit4-android artifact (createComposeRule + gesture
# dispatch on-device), pinned to the androidx.compose.ui version that
# compose-multiplatform 1.10.3 actually resolves to on the android target
# (verified via `./gradlew :composeApp:dependencies` — 1.10.5, not the
# compose-multiplatform version string itself).
androidx-compose-ui-test = "1.10.5"
# androidx.test's instrumentation runner + JUnit4 rule glue, needed to run
# any androidInstrumentedTest at all (AndroidJUnitRunner as
# testInstrumentationRunner, ActivityScenario used internally by
# createAndroidComposeRule/createComposeRule on the android target).
androidx-test-runner = "1.7.0"
androidx-test-junit = "1.3.0"
kotlinxSerialization = "1.7.3"
kotlinxCoroutines = "1.9.0"
ktor = "3.1.2"
sqldelight = "2.0.2"

[libraries]
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "androidx-activityCompose" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "androidx-core-ktx" }
androidx-core-splashscreen = { module = "androidx.core:core-splashscreen", version.ref = "androidx-core-splashscreen" }
androidx-lifecycle-viewmodel = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel", version.ref = "androidx-lifecycle" }
androidx-lifecycle-runtime-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-runtime-compose", version.ref = "androidx-lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "androidx-lifecycle" }
androidx-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "androidx-navigation3-ui" }
robolectric = { module = "org.robolectric:robolectric", version.ref = "robolectric" }
androidx-compose-ui-test-junit4 = { module = "androidx.compose.ui:ui-test-junit4-android", version.ref = "androidx-compose-ui-test" }
androidx-compose-ui-test-manifest = { module = "androidx.compose.ui:ui-test-manifest", version.ref = "androidx-compose-ui-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test-runner" }
androidx-test-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-junit" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "kotlinxSerialization" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "kotlinxCoroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "kotlinxCoroutines" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-content-negotiation = { module = "io.ktor:ktor-client-content-negotiation", version.ref = "ktor" }
ktor-serialization-kotlinx-json = { module = "io.ktor:ktor-serialization-kotlinx-json", version.ref = "ktor" }
ktor-client-okhttp = { module = "io.ktor:ktor-client-okhttp", version.ref = "ktor" }
ktor-client-darwin = { module = "io.ktor:ktor-client-darwin", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
sqldelight-runtime = { module = "app.cash.sqldelight:runtime", version.ref = "sqldelight" }
sqldelight-android-driver = { module = "app.cash.sqldelight:android-driver", version.ref = "sqldelight" }
sqldelight-native-driver = { module = "app.cash.sqldelight:native-driver", version.ref = "sqldelight" }

[plugins]
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidApplication = { id = "com.android.application", version.ref = "agp" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlinxSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
sqldelight = { id = "app.cash.sqldelight", version.ref = "sqldelight" }
