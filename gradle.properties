org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

kotlin.code.style=official

android.useAndroidX=true
android.nonTransitiveRClass=true

# AGP 9.0+ made the built-in Kotlin integration in com.android.application the default,
# which is incompatible with applying org.jetbrains.kotlin.multiplatform directly (as the
# Kotlin Multiplatform Gradle plugin still does for an application module in this AGP line).
# This is AGP's own documented workaround for that combination; see:
# https://developer.android.com/kotlin/multiplatform/plugin
android.builtInKotlin=false
android.newDsl=false

kotlin.native.disableCompilerDaemon=true
